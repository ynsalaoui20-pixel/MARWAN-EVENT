<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Eco App</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <header>

        <img
            src="logo.png"
            alt="Eco Livreur"
            class="logo"
        >

        <h1>ECO APP</h1>

        <p>Gestion des commandes</p>

    </header>


    <main>


        <section class="card">

            <h2>➕ Nouvelle commande</h2>


            <form id="orderForm">


                <label for="clientName">
                    Nom du client
                </label>

                <input
                    type="text"
                    id="clientName"
                    placeholder="Nom du client"
                    required
                >


                <label for="location">
                    📍 Lieu
                </label>

                <input
                    type="text"
                    id="location"
                    placeholder="Lieu de livraison"
                    required
                >


                <label for="phone">
                    📞 Téléphone
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="06 XX XX XX XX"
                    required
                >


                <label for="orderType">
                    📦 Type de commande
                </label>

                <input
                    type="text"
                    id="orderType"
                    placeholder="Ex: Colis"
                    required
                >


                <label for="price">
                    💰 Prix
                </label>

                <input
                    type="number"
                    id="price"
                    placeholder="Prix en DH"
                    required
                >


                <label for="status">
                    📌 Statut
                </label>

                <select id="status">

                    <option value="Reçue">
                        ✅ Reçue
                    </option>

                    <option value="Non reçue">
                        ⏳ Non reçue
                    </option>

                </select>


                <label for="notes">
                    📝 Notes
                </label>

                <textarea
                    id="notes"
                    placeholder="Notes..."
                ></textarea>


                <button type="submit">
                    💾 Enregistrer
                </button>


            </form>


        </section>


        <section class="card">

            <h2>📋 Commandes du jour</h2>

            <div id="ordersList">

                <p class="empty">
                    Aucune commande.
                </p>

            </div>

        </section>


    </main>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <script src="app.js"></script>

</body>

</html>
